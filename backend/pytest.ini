[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --tb=short
markers =
    security: RBAC, RLS and audit-log enforcement
    pipeline: ingest, profile, validate, clean, dry-run, load, rollback
    rules: individual validation rules
    ai: LLM client behaviour, including the deterministic fallback
    api: HTTP-level API contract tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
